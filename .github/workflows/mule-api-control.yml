name: MuleSoft API Start / Stop Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation"
        required: true
        type: choice
        options:
          - start
          - stop
      scope:
        description: "What should be affected?"
        required: true
        type: choice
        options:
          - application
          - bulk
      environment:
        description: "GitHub Environment / Anypoint environment to control"
        required: true
        type: choice
        options:
          - dev
          - qa
          - sandbox
          - design
          - prod
      application:
        description: "Application name for application scope. Leave blank for bulk."
        required: false
        type: string
      confirm:
        description: "Confirmation — select the matching confirmation"
        required: true
        type: choice
        options:
          - CONFIRM_START
          - CONFIRM_STOP

permissions:
  contents: read

concurrency:
  group: mule-api-control-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  control:
    name: "${{ inputs.action }} APIs in ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    env:
      # Anypoint CLI v4 authentication variables.
      # Existing GitHub secret names are preserved.
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_HOST: anypoint.mulesoft.com

      ACTION: ${{ inputs.action }}
      SCOPE: ${{ inputs.scope }}
      REQUESTED_APPLICATION: ${{ inputs.application }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Validate request and credentials
        shell: bash
        run: |
          set -euo pipefail

          expected_confirmation="CONFIRM_${ACTION^^}"
          if [ "$CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::Confirmation does not match the selected action."
            echo "::error::Action=$ACTION, Expected confirmation=$expected_confirmation, Selected confirmation=$CONFIRMATION"
            echo "::error::For START select CONFIRM_START. For STOP select CONFIRM_STOP."
            exit 1
          fi

          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Environment secret/value: $name"
              exit 1
            fi
          done

          if [ "$SCOPE" = "application" ] && [ -z "$REQUESTED_APPLICATION" ]; then
            echo "::error::Application name is required when scope=application."
            exit 1
          fi

          echo "GitHub/Anypoint environment: ${{ inputs.environment }}"
          echo "Action: $ACTION"
          echo "Scope: $SCOPE"
          echo "Application: ${REQUESTED_APPLICATION:-ALL}"
          echo "Confirmation: $CONFIRMATION"

      - name: Install Anypoint CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g anypoint-cli-v4-public
          anypoint-cli-v4 --version

      - name: Verify Anypoint Platform authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing Connected App authentication..."

          # List environments without ANYPOINT_ENV so the CLI does not try
          # to select the target environment before we can validate its name.
          env -u ANYPOINT_ENV anypoint-cli-v4 account:environment:list --output json > /tmp/anypoint-environments.json
          test -s /tmp/anypoint-environments.json

          echo "Anypoint Platform authentication successful."

          echo "Available Anypoint environments visible to this Connected App:"
          python3 - /tmp/anypoint-environments.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          seen = set()
          def walk(v):
              if isinstance(v, dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v, list):
                  for x in v: yield from walk(x)
          for obj in walk(data):
              for key in ("name", "environmentName"):
                  value = obj.get(key)
                  if value and str(value).strip() not in seen:
                      seen.add(str(value).strip())
                      print(f"  - {str(value).strip()}")
          PY

      - name: Resolve exact Anypoint environment
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$GITHUB_ENV" "${{ inputs.environment }}" /tmp/anypoint-environments.json <<'PY'
          import json
          import sys

          github_env = sys.argv[2].strip()
          github_file = sys.argv[1]
          path = sys.argv[3]

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          names = []
          seen = set()

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for v in value.values():
                      yield from walk(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from walk(v)

          for obj in walk(data):
              for key in ("name", "environmentName"):
                  value = obj.get(key)
                  if value:
                      name = str(value).strip()
                      if name and name.lower() not in seen:
                          seen.add(name.lower())
                          names.append(name)

          matches = [name for name in names if name.lower() == github_env.lower()]

          if not matches:
              print(f"::error::Anypoint environment '{github_env}' was not found.")
              print("Available Anypoint environments:")
              for name in names:
                  print("  - " + name)
              sys.exit(2)

          selected = matches[0]
          with open(github_file, "a", encoding="utf-8") as f:
              f.write("ANYPOINT_ENV=" + selected + "\n")

          print(f"Using exact Anypoint environment: {selected}")
          PY

      - name: Resolve target applications
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          all_apps="$(anypoint-cli-v4 runtime-mgr:application:list --output json)"
          printf '%s' "$all_apps" > all-apps.json

          python3 - <<'PY' > applications.txt
          import json
          import os
          import sys

          with open("all-apps.json", encoding="utf-8") as f:
              data = json.load(f)

          requested = os.environ.get("REQUESTED_APPLICATION", "").strip()
          scope = os.environ["SCOPE"]
          found = []

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for v in value.values():
                      yield from walk(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from walk(v)

          for obj in walk(data):
              app_id = obj.get("id")
              name = obj.get("name") or obj.get("applicationName")
              status = obj.get("status") or obj.get("applicationStatus")

              if not app_id or not name:
                  continue

              item = (str(name), str(app_id), str(status or "UNKNOWN"))

              if item not in found:
                  found.append(item)

          if scope == "application":
              matches = [
                  x for x in found
                  if x[0] == requested or x[1] == requested
              ]

              if not matches:
                  print(
                      f"Requested application was not found: {requested}",
                      file=sys.stderr
                  )
                  sys.exit(2)
          else:
              matches = found

          for name, app_id, status in sorted(matches):
              print(f"{name}|{app_id}|{status}")
          PY

      - name: Show execution plan
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s applications.txt ]; then
            echo "::error::No applications found in the selected Anypoint environment."
            exit 1
          fi

          echo "## MuleSoft API Control Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application | ID | Current status | Requested action |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          while IFS="|" read -r name app_id status; do
            echo "| $name | $app_id | $status | $ACTION |" >> "$GITHUB_STEP_SUMMARY"
          done < applications.txt

      - name: Converge applications to requested state
        shell: bash
        run: |
          set -euo pipefail

          # Each API gets its own short control window. If one API does not
          # reach the requested state, record it and continue with the others.
          per_api_attempts=6
          retry_seconds=10
          : > control-status.txt

          while IFS="|" read -r name app_id old_status; do
            reached=0

            for attempt in $(seq 1 "$per_api_attempts"); do
              raw="$(anypoint-cli-v4 runtime-mgr:application:describe "$app_id" --output json 2>/dev/null || true)"
              status="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("status") or d.get("Status") or d.get("application",{}).get("status") or "UNKNOWN").upper())' <<< "$raw" 2>/dev/null || echo UNKNOWN)"

              echo "$name => $status (attempt $attempt/$per_api_attempts)"

              if [ "$ACTION" = "stop" ]; then
                case "$status" in
                  STOPPED|TERMINATED|DELETED)
                    reached=1
                    break
                    ;;
                  *)
                    anypoint-cli-v4 runtime-mgr:application:stop "$app_id" || true
                    ;;
                esac
              else
                case "$status" in
                  RUNNING)
                    reached=1
                    break
                    ;;
                  APPLYING|PENDING|STARTING|RECOVERING|STOPPING)
                    echo "$name is transitioning; waiting..."
                    ;;
                  *)
                    anypoint-cli-v4 runtime-mgr:application:start "$app_id" || true
                    ;;
                esac
              fi

              sleep "$retry_seconds"
            done

            raw="$(anypoint-cli-v4 runtime-mgr:application:describe "$app_id" --output json 2>/dev/null || true)"
            status="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("status") or d.get("Status") or d.get("application",{}).get("status") or "UNKNOWN").upper())' <<< "$raw" 2>/dev/null || echo UNKNOWN)"

            if [ "$reached" -eq 1 ]; then
              echo "$name|$app_id|$status|SUCCESS" >> control-status.txt
              echo "Completed $ACTION for $name => $status"
            else
              echo "$name|$app_id|$status|SKIPPED" >> control-status.txt
              echo "::warning::$name did not reach the requested state within the control window. Skipping it and continuing with remaining APIs. Final status=$status"
            fi
          done < applications.txt

          echo "All applications have been processed. Failed/slow APIs were skipped so remaining APIs could continue."

      - name: Verify final state
        shell: bash
        run: |
          set -euo pipefail

          expected="$ACTION"
          max_attempts=24

          echo "CloudHub 2.0 verification: waiting for application status to reach the requested state."
          echo "For start, the required healthy state is RUNNING. APPLYING/APPLIED are not treated as running."

          : > final-status.txt

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Verification attempt $attempt/$max_attempts"
            failed=0
            pending=0
            : > final-status.txt

            while IFS="|" read -r name app_id old_status; do
              raw="$(anypoint-cli-v4 runtime-mgr:application:describe "$app_id" --output json 2>/dev/null || true)"

              if [ -z "$raw" ]; then
                echo "::error::Could not read status for $name ($app_id)"
                failed=1
                continue
              fi

              status="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("status") or d.get("Status") or d.get("application",{}).get("status") or "UNKNOWN").upper())' <<< "$raw" 2>/dev/null || echo UNKNOWN)"

              echo "$name => $status"
              printf '%s|%s|%s\n' "$name" "$app_id" "$status" >> final-status.txt

              if [ "$status" = "FAILED" ]; then
                echo "::error::$name is FAILED in CloudHub 2.0."
                python3 - "$name" "$raw" <<'PY'
          import json, sys
          name, raw = sys.argv[1], sys.argv[2]
          try:
              d = json.loads(raw)
          except Exception:
              print("Unable to parse describe response.")
              raise SystemExit(0)

          interesting = []
          def walk(v, path="root"):
              if isinstance(v, dict):
                  for k, x in v.items():
                      kl = k.lower()
                      if kl in ("reason", "message", "error", "errormessage", "state", "status") and isinstance(x, (str, int, float, bool)):
                          interesting.append((path + "." + k, str(x)))
                      walk(x, path + "." + k)
                  return
              if isinstance(v, list):
                  for i, x in enumerate(v):
                      walk(x, f"{path}[{i}]")

          walk(d)
          seen = set()
          print(f"Diagnostic details for {name}:")
          for path, value in interesting:
              item = f"{path} = {value}"
              if item not in seen:
                  seen.add(item)
                  print("  " + item)
          PY
                failed=1
                continue
              fi

              if [ "$expected" = "start" ]; then
                case "$status" in
                  RUNNING)
                    ;;
                  APPLYING|APPLIED|PENDING|STARTING|RECOVERING|STOPPING)
                    pending=1
                    ;;
                  STOPPED|TERMINATED|DELETED|UNKNOWN)
                    failed=1
                    ;;
                  *)
                    pending=1
                    ;;
                esac
              else
                case "$status" in
                  STOPPED|TERMINATED|DELETED)
                    ;;
                  STOPPING|APPLYING|PENDING)
                    pending=1
                    ;;
                  RUNNING|STARTING|RECOVERING|FAILED|UNKNOWN)
                    failed=1
                    ;;
                  *)
                    pending=1
                    ;;
                esac
              fi
            done < applications.txt

            if [ "$failed" -eq 0 ] && [ "$pending" -eq 0 ]; then
              echo "## Result: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "| Application | CloudHub 2.0 status |" >> "$GITHUB_STEP_SUMMARY"
              echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
              while IFS="|" read -r name app_id status; do
                echo "| $name | **$status** |" >> "$GITHUB_STEP_SUMMARY"
              done < final-status.txt
              echo "All selected applications reached the requested CloudHub 2.0 state."
              exit 0
            fi

            if [ "$failed" -gt 0 ]; then
              echo "::warning::One or more applications are not healthy in the requested state yet."
            fi

            if [ "$pending" -gt 0 ]; then
              echo "Applications are still transitioning; waiting 10 seconds before the next check."
            fi

            sleep 10
          done

          echo "## Final API Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application | Actual CloudHub 2.0 status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while IFS="|" read -r name app_id status; do
            echo "| $name | **$status** |" >> "$GITHUB_STEP_SUMMARY"
          done < final-status.txt

          echo "::error::Not all selected applications reached the requested CloudHub 2.0 state after $max_attempts verification attempts."
          echo "The workflow reports the actual status returned by CloudHub 2.0: RUNNING, APPLYING, FAILED, STOPPED, etc."
          exit 1

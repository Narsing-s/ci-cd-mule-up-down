name: MuleSoft API Start / Stop Control

run-name: "MuleSoft API Start / Stop Control #${{ github.run_number }} — ${{ inputs.environment }} — ${{ inputs.action }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation"
        required: true
        type: choice
        options:
          - start
          - stop
      scope:
        description: "What should be affected?"
        required: true
        type: choice
        options:
          - application
          - bulk
      environment:
        description: "GitHub Environment / Anypoint environment to control"
        required: true
        type: choice
        options:
          - dev
          - qa
          - sandbox
          - design
          - prod
      application:
        description: "Application name for application scope. Leave blank for bulk."
        required: false
        type: string
      confirm:
        description: "Confirmation — select the matching confirmation"
        required: true
        type: choice
        options:
          - CONFIRM_START
          - CONFIRM_STOP

permissions:
  contents: write

concurrency:
  group: mule-api-control-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  control:
    name: "${{ inputs.action }} APIs in ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    env:
      # Anypoint CLI v4 authentication variables.
      # Existing GitHub secret names are preserved.
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_HOST: anypoint.mulesoft.com

      ACTION: ${{ inputs.action }}
      SCOPE: ${{ inputs.scope }}
      REQUESTED_APPLICATION: ${{ inputs.application }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Validate request and credentials
        shell: bash
        run: |
          set -euo pipefail

          expected_confirmation="CONFIRM_${ACTION^^}"
          if [ "$CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::Confirmation does not match the selected action."
            echo "::error::Action=$ACTION, Expected confirmation=$expected_confirmation, Selected confirmation=$CONFIRMATION"
            echo "::error::For START select CONFIRM_START. For STOP select CONFIRM_STOP."
            exit 1
          fi

          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Environment secret/value: $name"
              exit 1
            fi
          done

          if [ "$SCOPE" = "application" ] && [ -z "$REQUESTED_APPLICATION" ]; then
            echo "::error::Application name is required when scope=application."
            exit 1
          fi

          echo "============================================================"
          case "${{ inputs.environment }}" in
            dev) echo "::notice::🔵 TARGET ENVIRONMENT: DEV — GitHub Environment [dev]" ;;
            qa) echo "::notice::🟡 TARGET ENVIRONMENT: QA — GitHub Environment [qa]" ;;
            sandbox) echo "::notice::🟣 TARGET ENVIRONMENT: SANDBOX — GitHub Environment [sandbox]" ;;
            design) echo "::notice::🟠 TARGET ENVIRONMENT: DESIGN — GitHub Environment [design]" ;;
            prod) echo "::warning::🔴 TARGET ENVIRONMENT: PRODUCTION — GitHub Environment [prod]" ;;
          esac
          echo "Environment: ${{ inputs.environment }}"
          echo "Action: $ACTION"
          echo "Scope: $SCOPE"
          echo "Application: ${REQUESTED_APPLICATION:-ALL}"
          echo "Confirmation: $CONFIRMATION"
          echo "============================================================"
          echo "Environment-specific GitHub secrets: ${{ inputs.environment }}"

      - name: Show target environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## 🎯 MuleSoft Control Target"
            echo ""
            case "${{ inputs.environment }}" in
              dev) echo "### 🔵 DEV" ;;
              qa) echo "### 🟡 QA" ;;
              sandbox) echo "### 🟣 SANDBOX" ;;
              design) echo "### 🟠 DESIGN" ;;
              prod) echo "### 🔴 PRODUCTION" ;;
            esac
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | **${{ inputs.environment }}** |"
            echo "| Action | **${ACTION}** |"
            echo "| Scope | **${SCOPE}** |"
            echo "| Application | **${REQUESTED_APPLICATION:-ALL}** |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Anypoint CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g anypoint-cli-v4-public
          anypoint-cli-v4 --version

      - name: Verify Anypoint Platform authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🔐 CONNECTED APP AUTHENTICATION"
          echo "Target environment: ${{ inputs.environment }}"
          echo "Token endpoint: https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token"
          echo "============================================================"
          response="$(curl -sS -w '\n%{http_code}' -X POST "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")"
          status="$(printf "%s\n" "$response" | tail -n1)"
          body="$(printf "%s\n" "$response" | sed '$d')"
          if [ "$status" != "200" ]; then
            error_code="$(printf "%s" "$body" | jq -r ".error // empty" 2>/dev/null || true)"
            error_description="$(printf "%s" "$body" | jq -r ".error_description // .message // empty" 2>/dev/null || true)"
            echo "::error::${{ inputs.environment }} Connected App authentication failed: HTTP $status."
            [ -n "$error_code" ] && echo "::error::Anypoint error: $error_code"
            [ -n "$error_description" ] && echo "::error::Anypoint message: $error_description"
            echo "::error::Check ANYPOINT_CLIENT_ID/ANYPOINT_CLIENT_SECRET in GitHub Environment ${{ inputs.environment }}."
            echo "::error::Verify the Connected App is active and authorized for this organization."
            exit 1
          fi
          token="$(printf "%s" "$body" | jq -r ".access_token // empty")"
          test -n "$token" || { echo "::error::Anypoint returned HTTP 200 but no access_token."; exit 1; }
          echo "::notice::${{ inputs.environment }} Connected App authentication successful."

          # List environments without ANYPOINT_ENV so the CLI does not try
          # to select the target environment before we can validate its name.
          env -u ANYPOINT_ENV anypoint-cli-v4 account:environment:list --output json > /tmp/anypoint-environments.json
          test -s /tmp/anypoint-environments.json

          echo "Anypoint Platform authentication successful."

          echo "Available Anypoint environments visible to this Connected App:"
          python3 - /tmp/anypoint-environments.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          seen = set()
          def walk(v):
              if isinstance(v, dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v, list):
                  for x in v: yield from walk(x)
          for obj in walk(data):
              for key in ("name", "environmentName"):
                  value = obj.get(key)
                  if value and str(value).strip() not in seen:
                      seen.add(str(value).strip())
                      print(f"  - {str(value).strip()}")
          PY

      - name: Resolve exact Anypoint environment
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$GITHUB_ENV" "${{ inputs.environment }}" /tmp/anypoint-environments.json <<'PY'
          import json
          import sys

          github_env = sys.argv[2].strip()
          github_file = sys.argv[1]
          path = sys.argv[3]

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          names = []
          seen = set()

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for v in value.values():
                      yield from walk(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from walk(v)

          for obj in walk(data):
              for key in ("name", "environmentName"):
                  value = obj.get(key)
                  if value:
                      name = str(value).strip()
                      if name and name.lower() not in seen:
                          seen.add(name.lower())
                          names.append(name)

          matches = [name for name in names if name.lower() == github_env.lower()]

          if not matches:
              print(f"::error::Anypoint environment '{github_env}' was not found.")
              print("Available Anypoint environments:")
              for name in names:
                  print("  - " + name)
              sys.exit(2)

          selected = matches[0]
          with open(github_file, "a", encoding="utf-8") as f:
              f.write("ANYPOINT_ENV=" + selected + "\n")

          print(f"Using exact Anypoint environment: {selected}")
          PY

      - name: Resolve target applications
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          all_apps="$(anypoint-cli-v4 runtime-mgr:application:list --output json)"
          printf '%s' "$all_apps" > all-apps.json

          python3 - <<'PY' > applications.txt
          import json
          import os
          import sys

          with open("all-apps.json", encoding="utf-8") as f:
              data = json.load(f)

          requested = os.environ.get("REQUESTED_APPLICATION", "").strip()
          scope = os.environ["SCOPE"]
          found = []

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for v in value.values():
                      yield from walk(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from walk(v)

          for obj in walk(data):
              app_id = obj.get("id")
              name = obj.get("name") or obj.get("applicationName")
              status = obj.get("status") or obj.get("applicationStatus")

              if not app_id or not name:
                  continue

              item = (str(name), str(app_id), str(status or "UNKNOWN"))

              if item not in found:
                  found.append(item)

          if scope == "application":
              matches = [
                  x for x in found
                  if x[0] == requested or x[1] == requested
              ]

              if not matches:
                  print(
                      f"Requested application was not found: {requested}",
                      file=sys.stderr
                  )
                  sys.exit(2)
          else:
              matches = found

          for name, app_id, status in sorted(matches):
              print(f"{name}|{app_id}|{status}")
          PY

      - name: Show execution plan
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s applications.txt ]; then
            echo "::error::No applications found in the selected Anypoint environment."
            exit 1
          fi

          echo "## MuleSoft API Control Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application | ID | Current status | Requested action |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          while IFS="|" read -r name app_id status; do
            echo "| $name | $app_id | $status | $ACTION |" >> "$GITHUB_STEP_SUMMARY"
          done < applications.txt

      - name: Converge applications to requested state
        shell: bash
        run: |
          set -euo pipefail

          # CloudHub 2.0 exposes two different concepts:
          #   * deployment state: APPLYING / APPLIED / FAILED
          #   * application desired state: STARTED / STOPPED
          # The workflow must not confuse APPLIED with RUNNING.
          per_api_attempts=6
          retry_seconds=10
          : > control-status.txt

          python3 - <<'PY'
          import concurrent.futures
          import json
          import subprocess
          import threading
          import time

          action = "\${{ inputs.action }}".upper()
          attempts = 6
          retry_seconds = 10
          lock = threading.Lock()

          rows = []
          with open("applications.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split("|", 2)
                  if len(parts) == 3:
                      rows.append(parts)

          def cli(*args):
              completed = subprocess.run(
                  ["anypoint-cli-v4", *args],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              return completed

          def collect_strings(value, key_name, out):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key.lower() == key_name.lower() and child is not None:
                          out.append(str(child).strip().upper())
                      collect_strings(child, key_name, out)
              elif isinstance(value, list):
                  for child in value:
                      collect_strings(child, key_name, out)

          def inspect(app_id):
              result = cli("runtime-mgr:application:describe", app_id, "--output", "json")
              raw = result.stdout.strip()
              if not raw:
                  return {
                      "ok": False,
                      "deployment": "UNKNOWN",
                      "desired": "UNKNOWN",
                      "error": (result.stderr or "No JSON returned by describe").strip(),
                  }

              try:
                  payload = json.loads(raw)
              except Exception as exc:
                  return {
                      "ok": False,
                      "deployment": "UNKNOWN",
                      "desired": "UNKNOWN",
                      "error": f"Invalid JSON from describe: {exc}",
                  }

              desired = []
              collect_strings(payload, "desiredState", desired)

              deployment = []
              for key in ("status", "deploymentStatus", "state"):
                  collect_strings(payload, key, deployment)

              desired_state = desired[0] if desired else "UNKNOWN"
              deployment_state = "UNKNOWN"
              for candidate in deployment:
                  if candidate in {"APPLIED", "APPLYING", "FAILED", "DELETED", "UNKNOWN"}:
                      deployment_state = candidate
                      break

              return {
                  "ok": result.returncode == 0,
                  "deployment": deployment_state,
                  "desired": desired_state,
                  "error": (result.stderr or "").strip(),
              }

          def target_reached(info):
              wanted = "STARTED" if action == "START" else "STOPPED"
              return info["desired"] == wanted and info["deployment"] == "APPLIED"

          def process(row):
              name, app_id, old_status = row
              last_error = ""

              for attempt in range(1, attempts + 1):
                  info = inspect(app_id)
                  desired = info["desired"]
                  deployment = info["deployment"]
                  last_error = info["error"]

                  with lock:
                      print(
                          f"{name} => deployment={deployment}, desired={desired} "
                          f"(attempt {attempt}/{attempts})",
                          flush=True
                      )

                  if target_reached(info):
                      break

                  wanted = "STARTED" if action == "START" else "STOPPED"
                  command = (
                      "runtime-mgr:application:start"
                      if action == "START"
                      else "runtime-mgr:application:stop"
                  )

                  if desired != wanted:
                      result = cli(command, app_id)
                      command_output = (result.stdout or "").strip()
                      command_error = (result.stderr or "").strip()
                      if result.returncode != 0:
                          last_error = command_error or command_output or (
                              f"{command} exited with code {result.returncode}"
                          )
                          with lock:
                              print(
                                  f"WARNING: {name} control command failed: {last_error}",
                                  flush=True
                              )
                      else:
                          with lock:
                              print(
                                  f"Submitted {action} for {name}: "
                                  f"{command_output or 'command accepted'}",
                                  flush=True
                              )
                  else:
                      with lock:
                          print(
                              f"{name} already has desired state {wanted}; waiting "
                              f"for deployment to become APPLIED.",
                              flush=True
                          )

                  if attempt < attempts:
                      time.sleep(retry_seconds)

              final_info = inspect(app_id)
              final_status = final_info["desired"]
              deployment = final_info["deployment"]
              if deployment != "APPLIED":
                  final_status = f"{final_status}/{deployment}"
              final_error = final_info["error"] or last_error

              result = "SUCCESS" if target_reached(final_info) else "FAILED"

              with lock:
                  with open("control-status.txt", "a", encoding="utf-8") as out:
                      out.write(f"{name}|{app_id}|{final_status}|{result}\n")
                  print(f"{name} => {final_status} => {result}", flush=True)
                  if result != "SUCCESS" and final_error:
                      print(
                          f"::warning::{name} final CLI error: {final_error}",
                          flush=True
                      )

          # Process every selected API concurrently so one slow application
          # never blocks the rest.
          with concurrent.futures.ThreadPoolExecutor(
              max_workers=max(1, len(rows))
          ) as executor:
              list(executor.map(process, rows))

          print("All selected APIs have been processed.", flush=True)
          PY

          echo "CloudHub 2.0 lifecycle control completed for every selected API."

      - name: Publish final API statistics
        shell: bash
        run: |
          set -euo pipefail

          echo "## Final API Statistics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application | Final desired/deployment status | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s control-status.txt ]; then
            echo "::error::No API results were produced."
            exit 1
          fi

          failures=0
          while IFS="|" read -r name app_id status result; do
            echo "| $name | **$status** | **$result** |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name => $status => $result"
            if [ "$result" != "SUCCESS" ]; then
              failures=$((failures + 1))
            fi
          done < control-status.txt

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures selected API(s) did not reach the requested CloudHub 2.0 state."
            echo "Bulk control processed every API, but the workflow is marked failed so a green run can never falsely imply that all APIs are up/down."
            exit 1
          fi

          echo "All selected APIs reached the requested CloudHub 2.0 state."

      - name: Publish machine-readable analytics
        if: always() && hashFiles('control-status.txt') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          rows = []
          with open("control-status.txt", encoding="utf-8") as f:
              for line in f:
                  parts = line.rstrip("\n").split("|")
                  if len(parts) == 4:
                      name, app_id, status, result = parts
                      rows.append({"name": name, "id": app_id, "status": status.upper(), "result": result.upper()})

          def count_status(*values):
              return sum(1 for r in rows if r["status"] in values)

          analytics = {
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "environment": os.environ["ANYPOINT_ENV"],
              "requestedEnvironment": os.environ["REQUESTED_ENVIRONMENT"],
              "action": os.environ["ACTION"],
              "scope": os.environ["SCOPE"],
              "application": os.environ.get("REQUESTED_APPLICATION", ""),
              "completedAt": datetime.now(timezone.utc).isoformat(),
              "summary": {
                  "total": len(rows),
                  "success": sum(1 for r in rows if r["result"] == "SUCCESS"),
                  "skipped": sum(1 for r in rows if r["result"] == "SKIPPED"),
                  "running": count_status("RUNNING"),
                  "stopped": count_status("STOPPED", "TERMINATED", "DELETED"),
                  "notRunning": sum(1 for r in rows if r["status"] not in ("RUNNING",)),
                  "unknown": count_status("UNKNOWN")
              },
              "applications": rows
          }

          with open("control-result.json", "w", encoding="utf-8") as f:
              json.dump(analytics, f, indent=2)
          PY

          path="control-results/${{ inputs.environment }}/latest.json"
          encoded="$(base64 -w 0 control-result.json)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq '.sha' 2>/dev/null || true)"

          if [ -n "$sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="chore: update MuleSoft control analytics" \
              -f content="$encoded" \
              -f sha="$sha" \
              -f branch="${{ github.ref_name }}" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="chore: publish MuleSoft control analytics" \
              -f content="$encoded" \
              -f branch="${{ github.ref_name }}" >/dev/null
          fi

          echo "Machine-readable analytics published to $path"
          cat control-result.json
